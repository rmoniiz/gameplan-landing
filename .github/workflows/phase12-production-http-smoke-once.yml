name: Phase 12 production HTTP smoke one-off

on:
  push:
    branches:
      - phase-12-production-readiness-landing
    paths:
      - '.github/workflows/phase12-production-http-smoke-once.yml'

permissions:
  contents: read

jobs:
  production-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FUNCTION_URL: https://ljuwnrbrneedzatbbslr.supabase.co/functions/v1/capture-marketing-lead
      ALLOWED_ORIGIN: https://gameplan-landing.vercel.app
      SMOKE_EMAIL: phase12-prod-http-smoke@example.invalid
    steps:
      - name: Exercise production Edge Function over real HTTP
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          header_has() {
            tr -d '\r' < "$1" | grep -Fxiq "$2"
          }

          options_code="$(curl -sS -D "$tmp/options.headers" -o "$tmp/options.body" -w '%{http_code}' \
            -X OPTIONS "$FUNCTION_URL" \
            -H "Origin: $ALLOWED_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')"
          test "$options_code" = "204"
          header_has "$tmp/options.headers" "access-control-allow-origin: $ALLOWED_ORIGIN"

          payload="{\"name\":\"Phase 12 HTTP Smoke\",\"email\":\"$SMOKE_EMAIL\",\"language\":\"pt-BR\",\"consentCapture\":true,\"utmSource\":\"github-actions\",\"utmMedium\":\"smoke\",\"utmCampaign\":\"phase12-production-http\"}"

          post_allowed() {
            local label="$1"
            curl -sS -D "$tmp/$label.headers" -o "$tmp/$label.body" -w '%{http_code}' \
              -X POST "$FUNCTION_URL" \
              -H "Origin: $ALLOWED_ORIGIN" \
              -H 'Content-Type: application/json' \
              --data "$payload"
          }

          first_code="$(post_allowed first)"
          test "$first_code" = "200"
          header_has "$tmp/first.headers" "access-control-allow-origin: $ALLOWED_ORIGIN"
          grep -q '"ok":true' "$tmp/first.body"
          grep -q '"duplicate":false' "$tmp/first.body"

          second_code="$(post_allowed second)"
          test "$second_code" = "200"
          grep -q '"duplicate":true' "$tmp/second.body"

          for n in 3 4 5; do
            code="$(post_allowed "attempt-$n")"
            test "$code" = "200"
            grep -q '"ok":true' "$tmp/attempt-$n.body"
          done

          sixth_code="$(post_allowed sixth)"
          test "$sixth_code" = "429"
          grep -q '"error":"rate_limited"' "$tmp/sixth.body"

          foreign_code="$(curl -sS -D "$tmp/foreign.headers" -o "$tmp/foreign.body" -w '%{http_code}' \
            -X POST "$FUNCTION_URL" \
            -H 'Origin: https://example.com' \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          test "$foreign_code" = "403"
          grep -q '"error":"origin_not_allowed"' "$tmp/foreign.body"
          if tr -d '\r' < "$tmp/foreign.headers" | grep -Fxiq 'access-control-allow-origin: https://example.com'; then
            echo 'Foreign origin was reflected unexpectedly' >&2
            exit 1
          fi

          no_consent_payload="{\"name\":\"Phase 12 HTTP Smoke\",\"email\":\"$SMOKE_EMAIL\",\"language\":\"pt-BR\",\"consentCapture\":false}"
          no_consent_code="$(curl -sS -o "$tmp/no-consent.body" -w '%{http_code}' \
            -X POST "$FUNCTION_URL" \
            -H "Origin: $ALLOWED_ORIGIN" \
            -H 'Content-Type: application/json' \
            --data "$no_consent_payload")"
          test "$no_consent_code" = "422"
          grep -q '"error":"consent_required"' "$tmp/no-consent.body"

          echo 'phase12-production-http-smoke=PASS'
